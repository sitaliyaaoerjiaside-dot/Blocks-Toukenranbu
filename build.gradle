plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    mixin {
        add sourceSets.main, "toukenranbu_mod.refmap.json"
        config "toukenranbu_mod.mixins.json"
    }

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven { url 'https://maven.blamejared.com' }

    maven {
        name "firstdarkdev"
        url "https://maven.firstdark.dev/snapshots"
    }
    flatDir { dir 'libs' }

    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
}

dependencies {
    // Forge 本体 MDG 自动管理，不用写 minecraft "..."

    modImplementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"

    modImplementation "net.kyrptonaught.customportalapi:customportalapi-reforged:1.0.2"

    modCompileOnly "vazkii.patchouli:Patchouli:1.20.1-85-FORGE:api"
    modRuntimeOnly "vazkii.patchouli:Patchouli:1.20.1-85-FORGE"

    compileOnly "org.jetbrains:annotations:24.0.1"

    modImplementation ":ldlib2-forge-1.20.1-2.2.37-dev"

    modImplementation ":kotlinforforge-4.12.0-all"

    modCompileOnly "dev.latvian.mods:kubejs-forge:${kubejs_version}"
    modRuntimeOnly "dev.latvian.mods:kubejs-forge:${kubejs_version}"

    modCompileOnly "dev.latvian.mods:rhino-forge:${rhino_version}"
    modRuntimeOnly "dev.latvian.mods:rhino-forge:${rhino_version}"

    modCompileOnly "dev.architectury:architectury-forge:${architectury_version}"
    modRuntimeOnly "dev.architectury:architectury-forge:${architectury_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    // MDG 自动处理重混淆，不需要 finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}